services:
  # ── 1. PostgreSQL Database Service ──
  postgres:
    image: postgres:16-alpine
    container_name: projectpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projectpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectpilot_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-projectpilot}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER:-projectpilot} -d $${POSTGRES_DB:-projectpilot}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - projectpilot-network

  # ── 2. ProjectPilot Fastify API Service ──
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: projectpilot-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      API_PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-projectpilot}:${POSTGRES_PASSWORD:-projectpilot_dev_password}@postgres:5432/${POSTGRES_DB:-projectpilot}
      JWT_SECRET: ${JWT_SECRET:-${SESSION_SECRET:-projectpilot_dev_secret_key_min_32_chars!}}
      SESSION_SECRET: ${SESSION_SECRET:-${JWT_SECRET:-projectpilot_dev_secret_key_min_32_chars!}}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:80,http://localhost:4000,http://localhost:5173}
      AI_PROVIDER: ${AI_PROVIDER:-${PLANNER_PROVIDER:-gemini}}
      PLANNER_PROVIDER: ${AI_PROVIDER:-${PLANNER_PROVIDER:-gemini}}
      AI_API_KEY: ${AI_API_KEY:-${OPENAI_API_KEY:-}}
      OPENAI_API_KEY: ${AI_API_KEY:-${OPENAI_API_KEY:-}}
      AI_MODEL: ${AI_MODEL:-gemini-3.8-flash}
      OPENAI_MODEL: ${AI_MODEL:-${OPENAI_MODEL:-gpt-4o}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${API_PORT:-4000}:4000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/health']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - projectpilot-network

  # ── 3. Web Client Service (Nginx Reverse Proxy & Static SPA) ──
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: projectpilot-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-80}:80'
    networks:
      - projectpilot-network

volumes:
  postgres_data:
    name: projectpilot_postgres_data

networks:
  projectpilot-network:
    name: projectpilot-network
    driver: bridge
